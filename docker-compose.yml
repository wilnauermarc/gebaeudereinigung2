# Zwei Container: die App und Caddy davor (holt und erneuert das https-Zertifikat selbst).
# Vor dem Start eine Datei .env anlegen (siehe .env.example) und DOMAIN eintragen.
services:
  app:
    build: .
    restart: unless-stopped
    environment:
      # Hinter dem Proxy: echte Client-Adresse (für die Begrenzung von Anmeldeversuchen) und https erkennen
      ADDRESS_HEADER: x-forwarded-for
      XFF_DEPTH: "1"
      PROTOCOL_HEADER: x-forwarded-proto
      HOST_HEADER: x-forwarded-host
      RESCH_DB: /data/resch.db
      BODY_SIZE_LIMIT: "26214400"
      # Schützt die Ersteinrichtung auf einem öffentlichen Server (Code beim ersten Aufruf eingeben)
      SETUP_TOKEN: ${SETUP_TOKEN:?Bitte SETUP_TOKEN in der Datei .env setzen}
      # Abo (nur Betreiber; leer = Eigenbetrieb ohne Begrenzung), siehe docs/betrieb.md
      LICENSE_PLAN: ${LICENSE_PLAN:-}
      LICENSE_TRIAL_UNTIL: ${LICENSE_TRIAL_UNTIL:-}
      LICENSE_PAID_UNTIL: ${LICENSE_PAID_UNTIL:-}
    volumes:
      - resch-data:/data
    expose:
      - "3000"

  # Öffentliche Demo (eigene Datenbank, erfundene Daten, nur lesend). Nur mit: docker compose --profile demo up -d
  demo:
    profiles: ["demo"]
    build: .
    restart: unless-stopped
    environment:
      ADDRESS_HEADER: x-forwarded-for
      XFF_DEPTH: "1"
      PROTOCOL_HEADER: x-forwarded-proto
      HOST_HEADER: x-forwarded-host
      RESCH_DB: /data/demo.db
      DEMO: "1"
    volumes:
      - demo-data:/data
    expose:
      - "3000"

  caddy:
    image: caddy:2
    restart: unless-stopped
    depends_on:
      - app
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMAIN: ${DOMAIN:?Bitte DOMAIN in der Datei .env setzen}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ./sites:/etc/caddy/sites:ro
      - caddy-data:/data
      - caddy-config:/config

volumes:
  demo-data:
  resch-data:
  caddy-data:
  caddy-config:
