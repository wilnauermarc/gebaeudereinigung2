<!doctype html>
<html lang="de">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<meta name="color-scheme" content="light dark" />
		<link rel="icon" href="%sveltekit.assets%/favicon.svg" />
		<link rel="manifest" href="%sveltekit.assets%/manifest.webmanifest" />
		<meta name="theme-color" content="#d95a14" />
		<title>Resch Business Manager</title>
		<script>
			try {
				var t = localStorage.getItem('resch-theme');
				if (t === 'dark' || (!t && matchMedia('(prefers-color-scheme: dark)').matches))
					document.documentElement.dataset.theme = 'dark';
			} catch (e) {}
			try {
				var m = JSON.parse(localStorage.getItem('resch-ui-mode') || '{}');
				if (m.palette && m.palette !== 'orange' && m.palette !== 'eigen') document.documentElement.setAttribute('data-palette', m.palette);
			} catch (e) {}
		</script>
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
